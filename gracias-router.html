<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procesando tu compra... — LIS. Creative Studio</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    body {
      background: #0a0a0a; color: #f5f4f1;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-size: 13px; letter-spacing: .05em;
    }
  </style>
</head>
<body>
  <p id="msg">Confirmando tu compra...</p>
  <script>
    var producto = localStorage.getItem('lis_producto');
    localStorage.removeItem('lis_producto');

    if (producto === 'brandbook') {
      window.location.replace('/gracias-brandbook' + window.location.search);
    } else if (producto === 'studio-kit') {
      window.location.replace('/gracias-studio-kit' + window.location.search);
    } else {
      document.getElementById('msg').innerHTML =
        'No pudimos confirmar automáticamente qué compraste — ' +
        'escribinos a <a href="mailto:hello@liscreativestudio.com" style="color:#f5f4f1;text-decoration:underline;">hello@liscreativestudio.com</a> con tu comprobante de pago y te lo enviamos enseguida.';
    }
  </script>
</body>
</html>
