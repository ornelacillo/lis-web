  <style>
/* ══════════════════════════════════════════════════════════
   LIS. Creative Studio · sistema visual 2026 (Planta Libre)
   Se carga después del CSS de cada página y lo sobreescribe.
   Crema + tinta + lima, mayúsculas apretadas (Inter Tight)
   con acentos en cursiva (Instrument Serif), píldoras y óvalos.
══════════════════════════════════════════════════════════ */

:root {
  --cream: #f4ede3;
  --ink: #1b1a17;
  --lime: #b8b2a7;   /* (antes lima) acento de texto: hormigón */
  --orange: #e8693a;
  --blue: #2b4c86;
  --stone: #b8b2a7;   /* hormigón · gris neutro */
  --rule: #1b1a17;
  --soft: #d8cebf;
  --black: #1b1a17;
  --white: #f4ede3;
  --light: #d8cebf;
  --gray: #6f6b64;
  --font-display: 'Inter Tight', 'Inter', Helvetica, Arial, sans-serif;
  --font-script: 'Instrument Serif', Georgia, serif;
}

body { background: var(--cream); color: var(--ink); }
::selection { background: var(--lime); color: var(--ink); }

/* ── Títulos grandes: mayúsculas apretadas ── */
.hero-title, .page-hero-title, .home-title, .post-title,
.res-title, .nl-title, .section-title, .includes-title, .cta-title,
.about-title, .test-title, .svc-name, .modality-title,
.hero h1, .booking-head h2, .price-amount, .footer-tagline {
  font-family: var(--font-display) !important;
  font-weight: 500 !important;
  text-transform: uppercase;
  letter-spacing: -.045em !important;
  line-height: .92 !important;
}

/* Palabra en cursiva dentro de un título */
.hero-title em, .page-hero-title em, .home-title em, .post-title em,
.res-title em, .nl-title em, .section-title em, .includes-title em, .cta-title em,
.about-title em, .test-title em, .svc-name em, .modality-title em,
.hero h1 em, .booking-head h2 em, .footer-tagline em, .section h2 em {
  font-family: var(--font-script);
  font-style: italic;
  font-weight: 400;
  text-transform: none;
  letter-spacing: -.01em;
}

/* Títulos largos (frases): Inter Tight sin mayúsculas */
.section h2, .modal-title, .post-body h2 {
  font-family: var(--font-display) !important;
  font-weight: 500 !important;
  letter-spacing: -.03em !important;
}

/* Frase destacada: cursiva editorial */
.callout-text {
  font-family: var(--font-script) !important;
  font-style: italic;
  font-size: clamp(2rem, 4vw, 3.4rem) !important;
  line-height: 1.08 !important;
  letter-spacing: -.01em !important;
  color: var(--ink) !important;
}

/* ── Etiquetas: píldoras con borde fino ── */
.section-label, .hero-label, .res-label, .includes-label, .page-hero-label,
.svc-label, .portfolio-label, .about-tag, .test-tag, .cta-sub, .service-label,
.res-tag, .pill-tag, .nl-tag, .modal-tag, .modality-num, .post-kicker, .footer-social-label, .footer-nl-label {
  display: inline-block !important;
  border: 1.5px solid currentColor !important;
  border-radius: 100px !important;
  padding: 6px 15px !important;
  font-family: 'Inter', Helvetica, Arial, sans-serif !important;
  font-size: 11px !important;
  font-weight: 500 !important;
  letter-spacing: .1em !important;
  text-transform: uppercase !important;
  line-height: 1.4 !important;
}
.page-hero .page-hero-label, .page-hero .hero-label { color: var(--lime) !important; }

/* ── Botones ── */
.res-btn, .pill-btn, .cta-btn, .hero-center-btn, .home-btn {
  border-radius: 100px !important;
  font-family: 'Inter', Helvetica, Arial, sans-serif !important;
  font-weight: 500 !important;
  letter-spacing: .06em !important;
  text-transform: uppercase;
  font-size: 12px !important;
}

/* ── Encabezados oscuros con foto desenfocada ── */
.page-hero, #home {

.faq-item, .faq-item:nth-child(even) { border-color: var(--soft) !important; background: transparent !important; }

.modal-list li, .modality-features li, .chip, .nl-perks li { background: var(--cream) !important; }

/* ── Footer ── */
footer { background: var(--cream) !important; border-top: 1.5px solid var(--ink) !important; }
.footer-tagline { color: var(--ink) !important; }
.footer-tagline-sub { color: var(--ink) !important; }
.footer-tagline-sub, .footer-tagline em {

/* Botón de contacto de la home */

/* Logo del menú en celular: negro sobre las secciones claras */
#lis-nav-mobile-logo.mobile-logo-dark img { filter: brightness(0) !important; }

/* ══════════════════════════════════════════════════════════
   Sin píldoras (oct 2026): las etiquetas son texto en mayúscula

══════════════════════════════════════════════════════════ */
.section-label, .hero-label, .res-label, .includes-label, .page-hero-label,
.svc-label, .portfolio-label, .about-tag, .test-tag, .cta-sub, .service-label,
.res-tag, .pill-tag, .nl-tag, .modal-tag, .modality-num, .post-kicker,
.footer-social-label, .footer-nl-label, .hero-badge, .res-badge, .lime-badge,
.include-num, .step-duration, .step-time, .res-soon {

  padding: 0 !important;

}
.modal-list li, .modal-list li:last-child, .modality-features li, .modality-features li:last-child,
.nl-perks li, .no-list li {

.res-btn, .pill-btn, .cta-btn, .hero-center-btn, .home-btn, .we-badge,

/* ══════════════════════════════════════════════════════════
   Bloques destacados con luz (oct 2026): fondo tinta con luz azul
   y naranja como en la dirección creativa, texto en crema.
   El naranja plano queda solo para los botones de adentro.
══════════════════════════════════════════════════════════ */
.callout-inner, .modality-panel, .modal-panel, .booking-head {
  background:
    radial-gradient(75% 95% at 100% 0%, rgba(43, 76, 134, .95) 0%, rgba(43, 76, 134, 0) 70%),
    radial-gradient(60% 85% at 0% 100%, rgba(232, 105, 58, .7) 0%, rgba(232, 105, 58, 0) 70%),
    var(--ink) !important;
  color: var(--cream) !important;
}
:is(.callout-inner, .modality-panel, .modal-panel, .booking-head) *:not(input):not(textarea):not(select) {
  color: inherit !important;
  border-color: rgba(244, 237, 227, .28) !important;
}
:is(.callout-inner, .modality-panel, .modal-panel, .booking-head) :is(button, .pill-btn, .res-btn, .cta-btn) {
  background: var(--blue) !important;
  color: var(--cream) !important;
  border-color: var(--blue) !important;
}
:is(.callout-inner, .modality-panel, .modal-panel, .booking-head) :is(input, textarea, select) {
  color: var(--ink) !important;
}

/* Tarjeta de la newsletter: gris neutro, sin luces ni naranja */
.nl-body { background: var(--stone) !important; color: var(--ink) !important; }
.nl-body *:not(input):not(textarea):not(select) { color: var(--ink) !important; border-color: rgba(27, 26, 23, .35) !important; }

.res-btn:hover, .pill-btn:hover, .cta-btn:hover, .hero-center-btn:hover, .home-btn:hover, #contact .cta-btn:hover { background: var(--ink) !important; color: var(--cream) !important; border-color: var(--ink) !important; }
.nl-body :is(button, .pill-btn, .res-btn) { background: var(--blue) !important; color: var(--cream) !important; border-color: var(--blue) !important; }

.footer-legal { display: flex; justify-content: space-between; gap: 16px; padding: 18px 40px; border-top: 1px solid var(--ink); font-family: 'Inter', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--gray); }

.footer-ml-wrap .ml-form-embedSubmit button, .nl-form-side .ml-form-embedSubmit button, .res-form .ml-form-embedSubmit button { background: var(--blue) !important; color: var(--cream) !important; border-color: var(--blue) !important; }

/* Etiquetas como nota al margen (oct 2026): cursiva, minúscula, sin letras separadas */
.section-label, .hero-label, .res-label, .includes-label, .page-hero-label,
.svc-label, .portfolio-label, .about-tag, .test-tag, .cta-sub, .service-label,
.res-tag, .pill-tag, .nl-tag, .modal-tag, .modality-num, .post-kicker,
.footer-social-label, .footer-nl-label, .hero-badge, .res-badge, .lime-badge,
